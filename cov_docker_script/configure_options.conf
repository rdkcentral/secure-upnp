# XUPnP Configure Options
# Flags derived from the SCXER10 Yocto do_compile log (xupnp 1.2.0).
# Cross-compile paths, sysroot, CPU tuning, optimization, and debug remapping
# flags are omitted for the native Coverity build.
# Breakpad flags are omitted because its headers are unavailable natively.

# ============================================================================
# NOTE: Pre-build setup commands are defined in component_config.json
# ============================================================================

[CONFIGURE]
--enable-version0.2
--enable-library-support
--enable-broadband-support
--enable-rdkb-inter-device-manager-support

# ============================================================================
# CPPFLAGS - Preprocessor flags (includes and defines)
# ============================================================================
[CPPFLAGS]
-DHAVE_CONFIG_H

# Native dependency headers installed by the component setup
-I$HOME/usr/include/gupnp-1.0
-I$HOME/usr/include/libsoup-2.4
-I$HOME/usr/include/safeclib
-I$HOME/usr/include/rdkb
-I$HOME/usr/include/rdkb/rbus

# Platform / product
-DSCXER10
-DUSE_DBUS
-DSUPPORT_IPV6
-DBRCM_CMS_MSG
-DFEATURE_RDKB_WAN_MANAGER
-DFEATURE_RDKB_LED_MANAGER
-DFEATURE_RDKB_LED_MANAGER_FACTORY_RESET
-DFEATURE_RDKB_LED_MANAGER_LEGACY_WAN
-DFEATURE_RDKB_LED_MANAGER_CAPTIVE_PORTAL
-DFEATURE_RDKB_LED_MANAGER_PORT
-DWAN_STATUS_LED_EVENT
-D_RDKB_GLOBAL_PRODUCT_REQ_
-DRBUS_BUILD_FLAG_ENABLE
-DFEATURE_RDKB_THERMAL_MANAGER
-D_SCER11BEL_PRODUCT_REQ_
-DCHIP_FAMILY_ID_HEX=0x6813
-DFEATURE_RDKB_NO_WPS_BUTTON
-DGPIO_LED_MGR
-D_XB6_PRODUCT_REQ_
-D_XB7_PRODUCT_REQ_
-D_XB8_PRODUCT_REQ_
-D_SKY_HUB_COMMON_PRODUCT_REQ_
-DBRIDGE_MODE_NOT_SUPPORTED
-DENABLE_FEATURE_TELEMETRY2_0
-DLOGMILESTONE
-DENABLE_HW_CERT_USAGE
-DCLIENT_XCAL_SERVER
-DBROADBAND
-DFEATURE_RDKB_INTER_DEVICE_MANAGER
-DGUPNP_0_19

# ============================================================================
# CFLAGS - Compiler flags
# ============================================================================
[CFLAGS]
-Wall
-Wextra
-Werror
-Wno-pointer-sign
-Wno-sign-compare
-Wno-deprecated-declarations
-Wno-type-limits
-Wno-unused-parameter
-Wno-lto-type-mismatch

# ============================================================================
# LDFLAGS - Linker flags
# ============================================================================
[LDFLAGS]
-L$HOME/usr/local/lib
-L$HOME/usr/lib
-L$HOME/usr/dummies
-Wl,--export-dynamic
-Wl,-O1
-Wl,--hash-style=gnu
-Wl,--as-needed
# Coverity-only platform stubs do not implement runtime symbols.
# The resulting binaries are for analysis, not execution.
-Wl,--unresolved-symbols=ignore-all

# ============================================================================
# LIBS - Platform libraries not supplied by pkg-config
# ============================================================================
[LIBS]
-lccsp_common
-lhal_platform
-lhal_msomgmt
-lcm_mgnt
-llmapi
-lhal_ethsw
-lsyscfg
-lsecure_wrapper
-lsafec
-ltelemetry_msgsender
-lsysevent
-lrdkconfig
-lrdkloggers
